name: daily-radar

# 每天跑一次扫描：抓 GitHub 候选 → 六维打分 → 写 data/ → 提交回仓库
on:
  schedule:
    # UTC 01:00 = 北京时间 09:00
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan GitHub and score
        env:
          # 有 PAT 用 PAT（5000 次/小时）；没有就退回 GITHUB_TOKEN（1000 次/小时）
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/scan.mjs

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/state.json data/archive
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(radar): scan $(date -u +%F)"
            git push
          fi
